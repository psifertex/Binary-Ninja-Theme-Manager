name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"   # the version Binary Ninja bundles

      # Qt needs these even for the offscreen platform plugin.
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3

      - name: Install Python dependencies
        run: pip install PySide6 requests

      # Binary Ninja is stubbed, so the whole suite runs without it.
      - name: Run tests
        run: python tests/run.py --system
